# ptab v3 - Partition Table
# Board: wodle (custom) — mirrors STOCK "AI Dou" flash layout recovered from firmware
# Chip: SF32LB525UC6 (SF32LB52x N16R8: 16MB NOR + 8MB PSRAM)
#
# Stock addresses (from /firmware/update.json, mpi2 base 0x12000000):
#   hcpu_app @ 0x12218000 (offset 0x218000), ezip @ 0x12460000, font @ 0x12AE0000,
#   dfu/ble FAL KV @ 0x12458000 / 0x1245c000.
# The vendor bootloader+ftab occupy 0x0..0x218000. We place the HCPU app at 0x218000
# so a custom app links to the same XIP address the stock bootloader jumps to.

version: 3
chip: SF32LB525UC6

memory:
  - mpi: mpi2
    type: nor
    size: 16777216 # 16MB (N16)

partitions:
  - name: hcpu_flash_code
    type: app
    subtype: factory
    region: mpi2
    offset: 0x218000      # -> XIP 0x12218000 (matches stock)
    size: 0x240000        # 2.25MB (stock region_size)
    core: HCPU

  # eZip graphics assets (stock 0x12460000)
  - name: ezip_region
    type: data
    subtype: raw
    region: mpi2
    offset: 0x460000
    size: 0x680000

  # Font data (stock 0x12AE0000)
  - name: font_region
    type: data
    subtype: raw
    region: mpi2
    offset: 0xAE0000
    size: 0x400000

  # Filesystem region (after font)
  - name: fs_region
    type: data
    subtype: filesystem
    region: mpi2
    offset: 0xEE0000
    size: 0x100000        # 1MB up to 16MB end

  # KVDB for DFU (stock FAL "dfu" @ 0x12458000)
  - name: dfu
    type: data
    subtype: flashdb_kv
    region: mpi2
    offset: 0x458000
    size: 16KB

  # KVDB for BLE (stock FAL "ble" @ 0x1245c000)
  - name: ble
    type: data
    subtype: flashdb_kv
    region: mpi2
    offset: 0x45c000
    size: 16KB

  # PSRAM data region (on SiP mpi1)
  - name: psram_data
    type: data
    subtype: ram
    region: mpi1
    offset: 0
    size: 8MB
